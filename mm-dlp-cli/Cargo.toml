[package]
name = "mm-dlp-cli"
version = "0.1.0"
edition = "2021"
default-run = "mm-dlp-cli"

[dependencies]
mm-dlp-core = { path = "../mm-dlp-core" }
clap = { version = "4.5.4", features = ["derive"] }
tokio = { version = "1.37.0", features = ["full"] }
uniffi = { version = "0.32.0", features = ["cli"] }
serde_json = { workspace = true }

[lib]
name = "mm_dlp_cli"
path = "src/lib.rs"

[[bin]]
name = "mm-dlp-cli"
path = "src/bin/mm-dlp-cli.rs"

[[bin]]
name = "yt-dlp"
path = "src/bin/yt-dlp.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
