[package]
name = "mm-dlp-cli"
version = "0.1.0"
edition = "2021"
default-run = "mm-dlp-cli"

[dependencies]
mm-dlp-core = { path = "../mm-dlp-core" }
clap = { version = "4.5.4", features = ["derive"] }
tokio = { version = "1.37.0", features = ["full"] }
uniffi = { version = "0.32.0", features = ["cli"] }

[[bin]]
name = "mm-dlp-cli"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
